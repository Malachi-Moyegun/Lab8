<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="moyegunmlab.8.css">
    <script src="moyegunm.lab.8.js" defer></script>
</head>
<body>

    <div class="game">
        <h1>Rock, Paper, Scissors Game</h1>
        <p>Choose your move to play against the computer!</p>

        <div class="buttons">
            <button id="rock">Rock</button>
            <button id="paper">Paper</button>
            <button id="scissors">Scissors</button>
        </div>

        <h2 id="result">Make your choice to start!</h2>

        <div class="scoreboard">
            <h3>Scoreboard</h3>
            <p>Wins: <span id="wins">0</span></p>
            <p>Losses: <span id="losses">0</span></p>
            <p>Ties: <span id="ties">0</span></p>
        </div>

        <button id="reset">Reset Score</button>
    </div>

</body>
</html>
